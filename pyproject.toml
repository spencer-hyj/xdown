[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xdown"
version = "0.1.0"
description = "Download X (Twitter) videos and optionally convert them to GIF"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["twitter", "x", "video", "download", "gif", "ffmpeg", "yt-dlp", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Conversion",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# xdown 本身无 pip 依赖；下载器/编码器走系统可执行文件

[project.scripts]
xdown = "xdown:main"

[project.urls]
Homepage = "https://github.com/spencer-hyj/xdown"
Issues = "https://github.com/spencer-hyj/xdown/issues"

[tool.setuptools]
py-modules = ["xdown"]
